name: 每周自动更新新闻

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装小机器人需要的工具
        run: pip install feedparser

      - name: 运行新闻抓取程序
        run: python generate_news.py

      - name: 保存并上传新闻网页
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --staged --quiet || git commit -m "机器人自动更新了本周新闻"
          git push
