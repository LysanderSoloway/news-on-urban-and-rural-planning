                        </div>

                `).join('');

                html += `
                    <div class="card">
                        <div class="category">

                            <span class="tag">${group.tag || ''}</span>
                        </div>
                        <ul class="news-list">${itemsHtml}</ul>
                        <div class="card-footer">📰 共 ${group.items.length} 条新闻</div>

                `;

            grid.innerHTML = html;

            bannerIcon.textContent = item.icon;
            bannerKeyword.textContent = item.name;
            bannerTag.textContent = item.tag;

            const dots = indicatorsContainer.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }

        function goTo(index) {
            if (index < 0) index = keywords.length - 1;
            if (index >= keywords.length) index = 0;
            currentIndex = index;
            updateBanner(currentIndex);
            resetInterval();
        }

        function next() {
            goTo(currentIndex + 1);
        }

        function resetInterval() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
            intervalId = setInterval(next, 4000);
        }

        renderIndicators();
        updateBanner(0);
        resetInterval();

        const banner = document.getElementById('banner');
        banner.addEventListener('mouseenter', function() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        });
        banner.addEventListener('mouseleave', function() {
            if (!intervalId) {
                intervalId = setInterval(next, 4000);
            }
        });

        // ============================================================
        // 回到顶部
        // ============================================================
        const backBtn = document.getElementById('backToTopBtn');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 300) {
                backBtn.classList.add('visible');
            } else {
                backBtn.classList.remove('visible');
            }
        });
        backBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
    </body></html>
